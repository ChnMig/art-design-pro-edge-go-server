services:
  redis:
    image: redis:7.4
    container_name: server-redis
    command: ["redis-server", "--requirepass", "${HTTP_SERVICES_REDIS_PASSWORD:?请设置 HTTP_SERVICES_REDIS_PASSWORD}"]
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    restart: always
  postgres:
    image: postgres:17.4
    container_name: server-postgres
    environment:
      POSTGRES_PASSWORD: "${HTTP_SERVICES_POSTGRES_PASSWORD:?请设置 HTTP_SERVICES_POSTGRES_PASSWORD}"
      POSTGRES_USER: "${HTTP_SERVICES_POSTGRES_USER:-postgres}"
      POSTGRES_DB: "${HTTP_SERVICES_POSTGRES_DBNAME:-server}"
      TZ: "${HTTP_SERVICES_POSTGRES_TIMEZONE:-Asia/Shanghai}"
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always
